name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build debug APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log
      - name: Show exact error (only if build failed)
        if: failure()
        shell: bash
        run: |
          echo "=========== ERROR SUMMARY ==========="
          grep -n -i -B2 -A10 "What went wrong\|FAILURE:\|error:" build.log | tail -n 150 || tail -n 100 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Qadir-Traders-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
